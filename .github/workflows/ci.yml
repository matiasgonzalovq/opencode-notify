name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: node:test suite
        run: npm test

      - name: vitest suite
        run: npm run test:vitest

  no-secrets:
    name: no secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Belt-and-braces: the repo must never carry a home directory, a private
      # hostname, or anything shaped like a credential.
      #
      # This workflow file is excluded because it necessarily contains the
      # literal detector patterns below and would otherwise flag itself.
      - name: Scan working tree and full history
        env:
          HOME_RE: (/Users|/home)/[a-z]+
          HOST_RE: ts\.net|tailnet
          CRED_RE: (ghp_|github_pat_|sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY)
          ASSIGN_RE: (password|secret|token|api[_-]?key)[[:space:]]*[:=][[:space:]]*["'][^"']{8,}
        run: |
          set -euo pipefail
          SELF=".github/workflows/ci.yml"
          fail=0

          scan() {
            label="$1" pattern="$2"
            if git grep -nI -E "$pattern" -- . ":(exclude)$SELF"; then
              echo "::error::${label} matched in working tree"
              fail=1
            fi
          }

          scan "home paths"        "$HOME_RE"
          scan "private hosts"     "$HOST_RE"
          scan "credential shape"  "$CRED_RE"
          scan "assigned secret"   "$ASSIGN_RE"

          # High-signal patterns across every commit reachable from HEAD.
          for rev in $(git rev-list --all); do
            if git grep -nI -E "$HOST_RE|$HOME_RE" "$rev" -- . ":(exclude)$SELF"; then
              echo "::error::private data matched in commit ${rev}"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::Secret or private-data scan failed"
            exit 1
          fi
          echo "Clean: no secrets or private paths in tree or history."
